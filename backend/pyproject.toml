[project]
name = "scit-lab-scheduling-backend"
version = "0.1.0"
description = "SCIT Computing Lab Scheduling - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the standard FastAPI DI pattern.
# BLE001: health check deliberately catches any DB failure to report "db: error".
# DTZ007: parsing wall-clock time-of-day / calendar-date strings, not tz-aware instants.
ignore = ["B008", "BLE001", "DTZ007"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
